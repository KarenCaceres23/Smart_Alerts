services:
  influxdb:
    image: influxdb:2.7
    container_name: smart_alerts_influxdb_integration
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=integrationpassword
      - DOCKER_INFLUXDB_INIT_ORG=smart_org
      - DOCKER_INFLUXDB_INIT_BUCKET=smart_bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=integration-token-12345
    volumes:
      - influxdb_data:/var/lib/influxdb2

volumes:
  influxdb_data:
